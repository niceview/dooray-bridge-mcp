[project]
name = "dooray-bridge"
version = "0.6.0"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.13.0",
    "mcp>=2.2.0",
]

[project.scripts]
dooray-mcp = "mcp_server.server:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["dooray_core", "mcp_server"]
